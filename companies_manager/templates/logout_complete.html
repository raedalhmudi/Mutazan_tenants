<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الخروج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logout-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .logout-container h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .logout-container p {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }
        .logout-container a {
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .logout-container a:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2>تم تسجيل الخروج بنجاح</h2>
        <p>لقد قمت بتسجيل الخروج من حسابك. يمكنك العودة إلى الصفحة الرئيسية أو تسجيل الدخول مرة أخرى.</p>
        <a href="{% url 'admin:login' %}">تسجيل الدخول مجددًا</a>
    </div>
</body>
</html>
